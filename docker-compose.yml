services:
  orchestrator:
    build:
      context: ./orchestrator
    image: dune-orchestrator:dev
    container_name: dune-orchestrator
    # Interpolated, not literal: podman-restart.service revives only
    # `always`, so an `unless-stopped` orchestrator stays down after a reboot
    # with nothing logged anywhere. runtime/scripts/lib/engine.sh exports the
    # per-engine value; the default keeps Docker exactly as it was.
    restart: "${DUNE_ENGINE_RESTART_POLICY:-unless-stopped}"
    network_mode: host
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    environment:
      SERVER_IP: "${SERVER_IP}"
      SERVER_TITLE: "${SERVER_TITLE}"
      SERVER_REGION: "${SERVER_REGION}"
      STEAM_APP_ID: "${STEAM_APP_ID:-4754530}"
      DUNE_ROOT: "/srv/dune"
      DUNE_SERVER_DIR: "/srv/dune/server"
      DUNE_STEAM_DIR: "/srv/dune/steam"
      DUNE_GENERATED_DIR: "/srv/dune/generated"
    volumes:
      # Source side only: a Podman host that skipped the podman.socket
      # drop-in keeps its API socket at /run/podman/podman.sock. The container
      # path stays put so the CLI inside needs no DOCKER_HOST.
      - "${DUNE_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      - dune-server:/srv/dune/server
      - dune-steam:/srv/dune/steam
      - dune-cache:/srv/dune/cache
      - dune-generated:/srv/dune/generated
      - dune-work:/work
    stdin_open: true
    tty: true
    command: ["dune", "daemon"]
    logging:
      driver: json-file
      options:
        max-size: "${DUNE_DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DUNE_DOCKER_LOG_MAX_FILES:-3}"

volumes:
  dune-server:
  dune-steam:
  dune-cache:
  dune-generated:
  dune-work:
